name: Build Installer

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      boost_version: 1.84.0
      BOOST_ROOT: ${{ github.workspace }}\deps\boost_1_84_0
      SDKVER: 10.0.19041.0

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure build environment
        shell: bash
        run: cp env.vs2022.bat env.bat

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          sdk: ${{ env.SDKVER }}

      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: ${{ env.BOOST_ROOT }}
          key: ${{ runner.os }}-boost-${{ env.boost_version }}-x86-x64

      - name: Install and build Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\install_boost.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Cache WinSparkle
        id: cache-winsparkle
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}\winsparkle\x64\Release\WinSparkle.dll
            ${{ github.workspace }}\winsparkle\x64\Release\WinSparkle.lib
            ${{ github.workspace }}\winsparkle\Release\WinSparkle.dll
            ${{ github.workspace }}\winsparkle\Release\WinSparkle.lib
          key: ${{ runner.os }}-winsparkle-v0.9.2-bundled

      - name: Build bundled WinSparkle
        if: steps.cache-winsparkle.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone https://github.com/vslavik/winsparkle.git -b v0.9.2 --depth 1
          Push-Location winsparkle
          git submodule update --init --recursive
          Copy-Item ..\bundled_winsparkle.patch .
          git apply bundled_winsparkle.patch
          nuget restore
          msbuild -m -t:Build -p:Configuration=Release -p:Platform=x64 WinSparkle.sln
          msbuild -m -t:Build -p:Configuration=Release -p:Platform=Win32 WinSparkle.sln
          Pop-Location

      - name: Install WinSparkle files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item .\winsparkle\x64\Release\WinSparkle.dll .\output\
          Copy-Item .\winsparkle\x64\Release\WinSparkle.lib .\lib64\
          Copy-Item .\winsparkle\Release\WinSparkle.dll .\output\Win32\
          Copy-Item .\winsparkle\Release\WinSparkle.lib .\lib\

      - name: Download prebuilt librime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\get-rime.ps1 -use dev

      - name: Build Rime data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\build.bat data
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Ensure NSIS is installed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\Bin\makensis.exe'
          if (-not (Test-Path $makensis)) {
            .\install_nsis.bat
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path $makensis)) {
            throw "makensis.exe was not installed at $makensis"
          }

      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\build.bat installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem .\output\archives\weasel*.exe |
            ForEach-Object { Write-Host "Built $($_.FullName)" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: weasel-koxia-installer-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: .\output\archives\weasel*.exe
